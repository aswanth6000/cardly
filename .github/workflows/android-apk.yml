name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate native Android project (expo prebuild)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug
      - name: Stage APK
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/cardly-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardly-debug-apk
          path: dist/cardly-debug.apk
          retention-days: 90
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-${{ github.run_number }}
          name: Android debug APK (build ${{ github.run_number }})
          prerelease: true
          files: dist/cardly-debug.apk
